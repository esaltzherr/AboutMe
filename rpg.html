<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elroy Saltzherr • Pokémon-Style RPG Portfolio Town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #14532d;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden !important;
      height: 100vh !important;
      width: 100vw !important;
      user-select: none;
      scrollbar-width: none !important;
    }
    ::-webkit-scrollbar { display: none !important; }

    #rpgCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }

    /* Top HUD */
    .top-hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1000;
      font-size: 0.65rem;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-chip {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #22c55e;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      padding: 8px 14px;
      color: #facc15;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav-rpg {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #475569;
      color: #94a3b8;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.62rem;
      pointer-events: auto;
      transition: all 0.2s;
    }
    .btn-nav-rpg:hover {
      border-color: #38bdf8;
      color: #fff;
      transform: translateY(-2px);
    }

    /* Retro Dialogue Box */
    #dialogue-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      width: 90%;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.97);
      border: 4px solid #facc15;
      border-radius: 14px;
      padding: 20px 24px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2000;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(250, 204, 21, 0.3);
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #dialogue-box.active {
      display: flex;
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .dialogue-speaker {
      font-size: 0.75rem;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dialogue-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      color: #f1f5f9;
      line-height: 1.6;
      margin-bottom: 14px;
      min-height: 50px;
    }

    .dialogue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.58rem;
      color: #94a3b8;
    }

    .btn-dialogue-close {
      background: #facc15;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* On-Screen Mobile D-Pad */
    .rpg-dpad {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 6px;
    }
    @media (max-width: 768px) {
      .rpg-dpad { display: grid; }
    }
    .dpad-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #475569;
      color: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      user-select: none;
    }
    .dpad-btn:active { background: #22c55e; color: #000; }
  </style>
</head>
<body>

    <div style="display: flex; gap: 8px;">
      <a href="play.html" class="btn-nav-rpg">◀ Arcade Hub</a>

  <script>
    /* =========================================================
       8-BIT RETRO AUDIO SYNTHESIZER
       ========================================================= */
    class RpgAudio {
      constructor() { this.ctx = null; this.enabled = true; }
      init() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); } }
      playChirp() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380 + Math.random() * 80, this.ctx.currentTime);
        g.gain.setValueAtTime(0.04, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
      }
      playStep() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        g.gain.setValueAtTime(0.02, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.04);
      }
      playDoor() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
        g.gain.setValueAtTime(0.06, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.15);
      }
      playFanfare() {
        if (!this.enabled || !this.ctx) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = f;
            g.gain.setValueAtTime(0.09, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.22);
          }, i * 90);
        });
      }
    }

    const sfx = new RpgAudio();
    document.addEventListener('click', () => sfx.init(), { once: true });
    document.addEventListener('keydown', () => sfx.init(), { once: true });

    document.getElementById('btnAudio').addEventListener('click', (e) => {
      sfx.enabled = !sfx.enabled;
      e.target.textContent = sfx.enabled ? '🔊 AUDIO: ON' : '🔇 AUDIO: OFF';
    });

    /* =========================================================
       WORLD SETUP & BUILDINGS
       ========================================================= */
    const canvas = document.getElementById('rpgCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Map Dimensions (Tiles: 32px each)
    const TILE = 32;
    const MAP_W = 60 * TILE; // 1920px wide
    const MAP_H = 50 * TILE; // 1600px high

    // Player Hero

    // 6 Walk-In Pokémon Buildings with Smooth Transparent Roofs!

      {

        wallColor: '#064e3b',
        floorColor: '#065f46',
        roofOpacity: 1.0,
        npc: {
          x: 1410, y: 750, name: 'Curator of Synergies', icon: '🃏',
          title: '100-Card EDH Recursion & Moxfield',

            "Outside in the garden meadow, you can visit his signature all-shiny Pokémon team! Go pet them!"
          ]
        },
        furniture: [
          { type: 'cards', x: 1280, y: 680, label: 'COMMANDER TABLE' },
          { type: 'crystal', x: 1480, y: 680, label: 'MANA ORB' }
        ]
      }
    ];

    // Roaming Shiny Pokémon in the central meadow & garden!
    const shinyPokemon = [
      { name: 'Marshadow ✨ (Purple Hat)', icon: '🥊', x: 900, y: 530, vx: 0.5, vy: 0, petText: 'Marshadow tips its purple Zenith hat and emits golden sparks! ✦' },
      { name: 'Wishiwashi ✨ (School Form)', icon: '🐟', x: 1100, y: 980, vx: -0.4, vy: 0.3, petText: 'Wishiwashi forms a mighty glittering school of fish! ✦' },
      { name: 'Perrserker ✨', icon: '⚔️', x: 620, y: 540, vx: 0, vy: -0.5, petText: 'Perrserker clinks its Viking iron claws happily! ✦' },
      { name: 'Mega Golisopod ✨', icon: '🛡️', x: 1350, y: 950, vx: 0.3, vy: -0.3, petText: 'Mega Golisopod gleams with white armored carapace! ✦' },
      { name: 'Cramorant ✨ (Gorging)', icon: '🦆', x: 1150, y: 550, vx: -0.5, vy: 0, petText: 'Cramorant gulps proudly with a glowing Pikachu! ✦' },
      { name: 'Litten ✨', icon: '🐱', x: 450, y: 530, vx: 0.4, vy: 0.2, petText: 'Shiny Litten purrs softly with white and red fur! ✦' }
    ];

    /* =========================================================
       INPUT HANDLING
       ========================================================= */
    const keys = {};
    window.addEventListener('keydown', e => {
      sfx.init();
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      if ((e.key === ' ' || e.key === 'e' || e.key === 'E') && isDialogueOpen) {
        advanceDialogue();
      } else if (e.key === ' ' || e.key === 'e' || e.key === 'E') {
        checkInteractions();
      }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // Touch D-Pad
    const setupDpad = (id, k) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', e => { e.preventDefault(); sfx.init(); keys[k] = true; });
      el.addEventListener('touchend', e => { e.preventDefault(); keys[k] = false; });
      el.addEventListener('mousedown', e => { e.preventDefault(); sfx.init(); keys[k] = true; });
      el.addEventListener('mouseup', e => { e.preventDefault(); keys[k] = false; });
    };
    setupDpad('dpUp', 'ArrowUp');
    setupDpad('dpDown', 'ArrowDown');
    setupDpad('dpLeft', 'ArrowLeft');
    setupDpad('dpRight', 'ArrowRight');
    document.getElementById('dpAction').addEventListener('click', () => {
      sfx.init();
      if (isDialogueOpen) advanceDialogue();
      else checkInteractions();
    });

    /* =========================================================
       DIALOGUE SYSTEM
       ========================================================= */
    const dialogueBox = document.getElementById('dialogue-box');
    const speakerEl = document.getElementById('dialogue-speaker');
    const textEl = document.getElementById('dialogue-text');
    let isDialogueOpen = false;
    let currentLines = [];
    let currentLineIdx = 0;
    let typeInterval = null;

    function openDialogue(speaker, title, lines) {
      isDialogueOpen = true;
      speakerEl.innerHTML = `<span>${speaker}</span> <span style="font-size:0.6rem; color:#facc15;">• ${title}</span>`;
      currentLines = lines;
      currentLineIdx = 0;
      dialogueBox.classList.add('active');
      typeLine(currentLines[currentLineIdx]);
      sfx.playFanfare();
    }

    function typeLine(str) {
      clearInterval(typeInterval);
      textEl.textContent = '';
      let charIdx = 0;
      typeInterval = setInterval(() => {
        textEl.textContent += str[charIdx];
        sfx.playChirp();
        charIdx++;
        if (charIdx >= str.length) {
          clearInterval(typeInterval);
        }
      }, 22);
    }

    function advanceDialogue() {
      if (currentLineIdx < currentLines.length - 1) {
        currentLineIdx++;
        typeLine(currentLines[currentLineIdx]);
      } else {
        closeDialogue();
      }
    }

    function closeDialogue() {
      clearInterval(typeInterval);
      dialogueBox.classList.remove('active');
      isDialogueOpen = false;
    }

    function checkInteractions() {
      // Check NPCs inside current building
      if (player.inBuilding) {
        const b = buildings.find(x => x.id === player.inBuilding);
        if (b && Math.hypot(player.x - b.npc.x, player.y - b.npc.y) < 70) {
          openDialogue(`${b.npc.icon} ${b.npc.name}`, b.npc.title, b.npc.lines);
          return;
        }
      }

      // Check Shiny Pokémon in the wild
      shinyPokemon.forEach(p => {
        if (Math.hypot(player.x - p.x, player.y - p.y) < 55) {
          openDialogue(`${p.icon} ${p.name}`, "Shiny Pokémon Companion", [p.petText]);
        }
      });
    }

    /* =========================================================
       UPDATE LOOP (Movement, Collisions, Roof Transparency)
       ========================================================= */
    function update() {
      if (isDialogueOpen) return;

      let dx = 0, dy = 0;
      if (keys['w'] || keys['W'] || keys['ArrowUp']) { dy -= 1; player.facing = 'up'; }
      if (keys['s'] || keys['S'] || keys['ArrowDown']) { dy += 1; player.facing = 'down'; }
      if (keys['a'] || keys['A'] || keys['ArrowLeft']) { dx -= 1; player.facing = 'left'; }
      if (keys['d'] || keys['D'] || keys['ArrowRight']) { dx += 1; player.facing = 'right'; }

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071; dy *= 0.7071;
      }

      const nextX = player.x + dx * player.speed;
      const nextY = player.y + dy * player.speed;

      // Keep within map bounds
      player.x = Math.max(30, Math.min(MAP_W - 30, nextX));
      player.y = Math.max(30, Math.min(MAP_H - 30, nextY));

      if (dx !== 0 || dy !== 0) {
        player.stepTick++;
        if (player.stepTick % 18 === 0) sfx.playStep();
      }

      // Building Walk-In & Roof Transparency Logic
      let insideAny = null;
      buildings.forEach(b => {
        const inside = (
          player.x >= b.x + 10 && player.x <= b.x + b.w - 10 &&
          player.y >= b.y + 10 && player.y <= b.y + b.h - 10
        );

        if (inside) {
          insideAny = b.id;
          // Smoothly fade roof to transparent!
          b.roofOpacity = Math.max(0.08, b.roofOpacity - 0.08);
        } else {
          // Fade roof back to solid
          b.roofOpacity = Math.min(1.0, b.roofOpacity + 0.08);
        }
      });

      if (insideAny !== player.inBuilding) {
        player.inBuilding = insideAny;
        sfx.playDoor();
        const indicator = document.getElementById('buildingIndicator');
        if (insideAny) {
          const b = buildings.find(x => x.id === insideAny);
          indicator.textContent = `INSIDE: ${b.name.toUpperCase()}`;
          indicator.style.color = '#38bdf8';
        } else {
          indicator.textContent = `CURRENT: OUTSIDE MEADOW`;
          indicator.style.color = '#facc15';
        }
      }

      // Roaming Shiny Pokémon AI
      shinyPokemon.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (Math.random() < 0.02) {
          p.vx = (Math.random() - 0.5) * 0.8;
          p.vy = (Math.random() - 0.5) * 0.8;
        }
      });
    }

    /* =========================================================
       DRAW LOOP (Pokemon Town Canvas Graphics)
       ========================================================= */
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Camera Offset (centers player)
      const camX = canvas.width / 2 - player.x;
      const camY = canvas.height / 2 - player.y;

      ctx.save();
      ctx.translate(camX, camY);

      // 1. Lush Green Grass Meadow Background
      ctx.fillStyle = '#15803d'; // Rich Pokemon Grass
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      // Subtle grass texture checker
      ctx.fillStyle = '#16a34a';
      for (let r = 0; r < MAP_H; r += TILE * 2) {
        for (let c = 0; c < MAP_W; c += TILE * 2) {
          ctx.fillRect(c, r, TILE, TILE);
        }
      }

      // 2. Cobblestone Paths connecting all buildings
      ctx.fillStyle = '#cbd5e1';
      // Main central horizontal road
      ctx.fillRect(200, 500, 1400, 50);
      // Vertical roads to buildings
      ctx.fillRect(360, 440, 40, 100);
      ctx.fillRect(860, 440, 40, 100);
      ctx.fillRect(1390, 440, 40, 100);
      ctx.fillRect(360, 550, 40, 320);
      ctx.fillRect(860, 550, 40, 320);
      ctx.fillRect(1390, 550, 40, 320);

      // 3. Flower Patches & Picket Fences
      ctx.font = '16px sans-serif';
      ctx.fillText('🌸', 600, 480);
      ctx.fillText('🌼', 630, 485);
      ctx.fillText('🌷', 660, 475);
      ctx.fillText('🌸', 1150, 480);
      ctx.fillText('🌼', 1180, 485);
      ctx.fillText('🌷', 1210, 475);
      ctx.fillText('🌳', 150, 150);
      ctx.fillText('🌳', 640, 150);
      ctx.fillText('🌳', 1140, 150);
      ctx.fillText('🌳', 1650, 150);

      // 4. Buildings: Interior & Transparent Roof Layers
      buildings.forEach(b => {
        // --- INTERIOR (Floors, walls, furniture, NPC) ---
        ctx.fillStyle = b.floorColor;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Interior Wall Border
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.strokeRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);

        // Furniture
        b.furniture.forEach(f => {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(f.x, f.y, 60, 35);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(f.x, f.y, 60, 35);
          ctx.fillStyle = '#f8fafc';
          ctx.font = '6px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText(f.label, f.x + 30, f.y + 20);
        });

        // Inside NPC
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(b.npc.x, b.npc.y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.npc.icon, b.npc.x, b.npc.y);

        // Interaction Prompt when near NPC
        if (Math.hypot(player.x - b.npc.x, player.y - b.npc.y) < 70) {
          ctx.fillStyle = '#fbbf24';
          ctx.font = '8px "Press Start 2P"';
          ctx.fillText('[SPACE TO TALK]', b.npc.x, b.npc.y - 26);
        }

        // --- EXTERIOR / ROOF LAYER (With dynamic opacity transition!) ---
        if (b.roofOpacity > 0.05) {
          ctx.save();
          ctx.globalAlpha = b.roofOpacity;

          // Building Walls
          ctx.fillStyle = b.wallColor;
          ctx.fillRect(b.x, b.y + 40, b.w, b.h - 40);

          // Roof (Angled Pokémon Gym / Mart style)
          ctx.fillStyle = b.roofColor;
          ctx.beginPath();
          ctx.moveTo(b.x - 10, b.y + 45);
          ctx.lineTo(b.x + b.w / 2, b.y - 15);
          ctx.lineTo(b.x + b.w + 10, b.y + 45);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Building Nameplate Sign
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(b.x + 20, b.y + 55, b.w - 40, 26);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x + 20, b.y + 55, b.w - 40, 26);

          ctx.fillStyle = '#fff';
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText(b.name, b.x + b.w / 2, b.y + 72);

          // Front Doorway
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(b.doorX, b.doorY - 35, 40, 35);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(b.doorX, b.doorY - 5, 40, 5); // Welcome doormat

          ctx.restore();
        }
      });

      // 5. Roaming Shiny Pokémon
      shinyPokemon.forEach(p => {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.icon, p.x, p.y);

        // Golden Sparkles
        ctx.fillStyle = '#fef08a';
        ctx.font = '10px sans-serif';
        ctx.fillText('✦', p.x + 14, p.y - 12);

        // Petting prompt
        if (Math.hypot(player.x - p.x, player.y - p.y) < 55) {
          ctx.fillStyle = '#fbbf24';
          ctx.font = '7px "Press Start 2P"';
          ctx.fillText('[SPACE TO PET]', p.x, p.y - 24);
        }
      });

      // 6. Player Hero Sprite (Pokemon Trainer)
      ctx.fillStyle = '#ef4444'; // Red cap
      ctx.beginPath(); ctx.arc(player.x, player.y - 6, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b82f6'; // Blue trainer jacket
      ctx.fillRect(player.x - 7, player.y, 14, 16);
      ctx.fillStyle = '#0f172a'; // Shoes
      ctx.fillRect(player.x - 6, player.y + 16, 4, 4);
      ctx.fillRect(player.x + 2, player.y + 16, 4, 4);

      ctx.restore();
    }

    /* =========================================================
       MAIN GAME LOOP
       ========================================================= */
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
